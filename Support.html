<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="Colors.css">

    <style>
        body {
            background-color: var(--secondary);
            padding: 0px;
            margin: 0px;
            font-size: 2vh;
        }

        .title {
            color: var(--secondary);
            text-align: left;
            align-items: center;
            margin-left: 1.5vw;
            font-size: calc(2.3vh + 0.7vw);
            margin-right: 1.5vw;
        }

        .titleline {
            background-color: var(--primary);
            margin: 0px;
            padding: 10px 0;
            align-items: center;
            height: 7vh;
            display: flex;
        }

        .button {
            margin-top: 2vh;
            margin-bottom: 2vh;
            margin-right: 2vw;
            align-items: center;
            background: var(--tertiary);
            font-size: calc(1.6vh + 0.6vw);
            outline: 0px;
            outline-color: var(--tertiary);
        }

        .logo {
            height: calc(4.5vh + 2vw);
        }

    </style>
</head>

<body>
    <div class="titleline">
        <img class="logo" src="chslogo.png">
        <h1 class="title">Cedarcrest Chess Team</h1>
        <button onclick="window.location.href='index.html'" class="button" style="display: block; margin-left: auto;">Home</button>
        <button onclick="window.location.href='Calendar.html'" class="button">Calendar</button>
        <button onclick="window.location.href='Support.html'" class="button">Support</button>
        <button onclick="window.location.href='Team.html'" class="button">Team</button>
    </div>
    <script>

    </script>
</body>
